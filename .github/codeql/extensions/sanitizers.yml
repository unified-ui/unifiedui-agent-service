extensions:
  - addsTo:
      pack: codeql/go-all
      extensible: summaryModel
    data:
      # summaryModel signature (10 columns):
      #   package, type, subtypes, name, signature, ext, input, output, kind, provenance
      #
      # Self-loop (Argument[0] -> Argument[0]) with NO flow to ReturnValue.
      # summaryModel replaces source-level analysis, so the return value is clean.

      # sanitizeValue: validates input against strict allowlist regex.
      - ["github.com/unifiedui/agent-service/internal/infrastructure/docdb/mongodb", "", false, "sanitizeValue", "", "", "Argument[0]", "Argument[0]", "value", "manual"]

      # sanitizeRegex: escapes regex meta-characters via regexp.QuoteMeta.
      - ["github.com/unifiedui/agent-service/internal/infrastructure/docdb/mongodb", "", false, "sanitizeRegex", "", "", "Argument[0]", "Argument[0]", "value", "manual"]

      # validateHTTPURL: validates URL scheme (http/https only) and host presence.
      - ["github.com/unifiedui/agent-service/internal/services/traceimport/foundry", "", false, "validateHTTPURL", "", "", "Argument[0]", "Argument[0]", "value", "manual"]
      - ["github.com/unifiedui/agent-service/internal/services/traceimport/n8n", "", false, "validateHTTPURL", "", "", "Argument[0]", "Argument[0]", "value", "manual"]

      # validateIdentifier: validates identifiers against strict allowlist regex.
      - ["github.com/unifiedui/agent-service/internal/services/traceimport/foundry", "", false, "validateIdentifier", "", "", "Argument[0]", "Argument[0]", "value", "manual"]
      - ["github.com/unifiedui/agent-service/internal/services/traceimport/n8n", "", false, "validateIdentifier", "", "", "Argument[0]", "Argument[0]", "value", "manual"]

      # SanitizePathParam: validates path parameters against strict allowlist regex.
      - ["github.com/unifiedui/agent-service/internal/api/middleware", "", false, "SanitizePathParam", "", "", "Argument[0]", "Argument[0]", "value", "manual"]
