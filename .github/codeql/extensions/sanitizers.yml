extensions:
  - addsTo:
      pack: codeql/go-all
      extensible: neutralModel
    data:
      # sanitizeValue: validates input against strict allowlist regex.
      # Rejects invalid input (returns ""). No taint flows through this function.
      - ["github.com/unifiedui/agent-service/internal/infrastructure/docdb/mongodb", "", "sanitizeValue", "", "summary", "manual"]

      # sanitizeRegex: escapes regex meta-characters via regexp.QuoteMeta.
      # Output is safe for use in MongoDB $regex. No taint flows through this function.
      - ["github.com/unifiedui/agent-service/internal/infrastructure/docdb/mongodb", "", "sanitizeRegex", "", "summary", "manual"]

      # validateHTTPURL: validates URL scheme (http/https only) and host presence.
      # Rejects non-HTTP schemes and hostless URLs. No taint flows through this function.
      - ["github.com/unifiedui/agent-service/internal/services/traceimport/foundry", "", "validateHTTPURL", "", "summary", "manual"]
      - ["github.com/unifiedui/agent-service/internal/services/traceimport/n8n", "", "validateHTTPURL", "", "summary", "manual"]

      # validateIdentifier: validates identifiers against strict allowlist regex.
      # Rejects invalid input (returns ""). No taint flows through this function.
      - ["github.com/unifiedui/agent-service/internal/services/traceimport/foundry", "", "validateIdentifier", "", "summary", "manual"]
      - ["github.com/unifiedui/agent-service/internal/services/traceimport/n8n", "", "validateIdentifier", "", "summary", "manual"]

      # SanitizePathParam: validates path parameters against strict allowlist regex.
      # Extracts c.Param(key) and validates before returning. No taint flows through this function.
      - ["github.com/unifiedui/agent-service/internal/api/middleware", "", "SanitizePathParam", "", "summary", "manual"]
