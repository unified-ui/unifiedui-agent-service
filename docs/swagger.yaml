basePath: /
definitions:
  dto.AICapabilitiesResponse:
    properties:
      description_generation:
        type: boolean
      summarization:
        type: boolean
      title_generation:
        type: boolean
      trace_analysis:
        type: boolean
    type: object
  dto.AddLogsRequest:
    properties:
      logs:
        items: {}
        minItems: 1
        type: array
    required:
    - logs
    type: object
  dto.AddNodesRequest:
    properties:
      nodes:
        items:
          $ref: '#/definitions/dto.TraceNodeRequest'
        minItems: 1
        type: array
    required:
    - nodes
    type: object
  dto.AnalyzeTraceRequest:
    properties:
      error:
        type: string
      input:
        additionalProperties: true
        type: object
      node_id:
        type: string
      node_name:
        type: string
      node_type:
        type: string
      output:
        additionalProperties: true
        type: object
      trace_id:
        type: string
    required:
    - error
    - node_name
    - node_type
    type: object
  dto.AnalyzeTraceResponse:
    properties:
      analysis:
        type: string
    type: object
  dto.CreateTraceRequest:
    properties:
      chatAgentId:
        description: Context fields - EITHER (chatAgentId + conversationId) OR workflowId
        type: string
      conversationId:
        type: string
      id:
        description: ID is optional; if not provided, one will be generated.
        type: string
      logs:
        description: Initial logs (optional).
        items: {}
        type: array
      nodes:
        description: Initial nodes (optional).
        items:
          $ref: '#/definitions/dto.TraceNodeRequest'
        type: array
      referenceId:
        description: Reference fields for external system linkage.
        type: string
      referenceMetadata:
        additionalProperties: true
        type: object
      referenceName:
        type: string
      workflowId:
        type: string
    type: object
  dto.CreateTraceResponse:
    properties:
      id:
        type: string
    type: object
  dto.ErrorResponse:
    properties:
      code:
        type: string
      details:
        type: string
      message:
        type: string
    type: object
  dto.GenerateDescriptionRequest:
    properties:
      context:
        additionalProperties: true
        type: object
      entity_name:
        type: string
      entity_type:
        type: string
      existing_description:
        type: string
    required:
    - entity_name
    - entity_type
    type: object
  dto.GenerateDescriptionResponse:
    properties:
      description:
        type: string
    type: object
  dto.ImportTraceResponse:
    properties:
      id:
        type: string
    type: object
  dto.ListTracesResponse:
    properties:
      total:
        type: integer
      traces:
        items:
          $ref: '#/definitions/dto.TraceResponse'
        type: array
    type: object
  dto.ListWorkflowRunsResponse:
    properties:
      nextCursor:
        type: string
      runs:
        items:
          $ref: '#/definitions/dto.WorkflowRunResponse'
        type: array
    type: object
  dto.NodeDataIORequest:
    properties:
      extraData:
        additionalProperties: true
        type: object
      metadata:
        additionalProperties: true
        type: object
      text:
        type: string
    type: object
  dto.NodeDataIOResponse:
    properties:
      extraData:
        additionalProperties: true
        type: object
      metadata:
        additionalProperties: true
        type: object
      text:
        type: string
    type: object
  dto.NodeDataRequest:
    properties:
      input:
        $ref: '#/definitions/dto.NodeDataIORequest'
      output:
        $ref: '#/definitions/dto.NodeDataIORequest'
    type: object
  dto.NodeDataResponse:
    properties:
      input:
        $ref: '#/definitions/dto.NodeDataIOResponse'
      output:
        $ref: '#/definitions/dto.NodeDataIOResponse'
    type: object
  dto.RefreshTraceRequest:
    properties:
      logs:
        description: Logs to set.
        items: {}
        type: array
      nodes:
        description: Nodes to set.
        items:
          $ref: '#/definitions/dto.TraceNodeRequest'
        type: array
      referenceId:
        description: Reference fields for external system linkage.
        type: string
      referenceMetadata:
        additionalProperties: true
        type: object
      referenceName:
        type: string
    type: object
  dto.SummarizeTraceRequest:
    properties:
      detail_level:
        enum:
        - short
        - medium
        - long
        type: string
      nodes:
        items:
          additionalProperties: true
          type: object
        type: array
      trace_id:
        type: string
    required:
    - detail_level
    - nodes
    type: object
  dto.SummarizeTraceResponse:
    properties:
      summary:
        type: string
    type: object
  dto.TestConnectionRequest:
    properties:
      config:
        additionalProperties: true
        type: object
      credential_id:
        type: string
      test_type:
        $ref: '#/definitions/dto.TestConnectionType'
      url:
        type: string
    required:
    - test_type
    - url
    type: object
  dto.TestConnectionResponse:
    properties:
      message:
        type: string
      response_time_ms:
        type: integer
      success:
        type: boolean
    type: object
  dto.TestConnectionType:
    enum:
    - N8N_CHAT_URL
    - N8N_WORKFLOW
    - N8N_WEBHOOK
    - FOUNDRY_AGENT
    - REST_API_INVOKE
    - REST_API_CONVERSATION
    type: string
    x-enum-varnames:
    - TestConnectionTypeN8NChatURL
    - TestConnectionTypeN8NWorkflow
    - TestConnectionTypeN8NWebhook
    - TestConnectionTypeFoundryAgent
    - TestConnectionTypeRestAPIInvoke
    - TestConnectionTypeRestAPIConversation
  dto.TestModelRequest:
    properties:
      config:
        additionalProperties: true
        type: object
      credential_id:
        type: string
      provider:
        type: string
    required:
    - config
    - provider
    type: object
  dto.TestModelResponse:
    properties:
      message:
        type: string
      response_time_ms:
        type: integer
      success:
        type: boolean
    type: object
  dto.TraceChatMessage:
    properties:
      content:
        type: string
      role:
        enum:
        - user
        - assistant
        type: string
    required:
    - content
    - role
    type: object
  dto.TraceChatRequest:
    properties:
      history:
        items:
          $ref: '#/definitions/dto.TraceChatMessage'
        type: array
      message:
        type: string
      selected_node:
        type: string
      trace:
        type: string
    required:
    - message
    - trace
    type: object
  dto.TraceChatResponse:
    properties:
      reply:
        type: string
    type: object
  dto.TraceNodeRequest:
    properties:
      data:
        $ref: '#/definitions/dto.NodeDataRequest'
      duration:
        type: number
      endAt:
        type: string
      id:
        type: string
      logs:
        items: {}
        type: array
      metadata:
        additionalProperties: true
        type: object
      name:
        type: string
      nodes:
        description: Sub-nodes
        items:
          $ref: '#/definitions/dto.TraceNodeRequest'
        type: array
      referenceId:
        type: string
      startAt:
        type: string
      status:
        type: string
      type:
        type: string
    required:
    - id
    - name
    - status
    - type
    type: object
  dto.TraceNodeResponse:
    properties:
      createdAt:
        type: string
      createdBy:
        type: string
      data:
        $ref: '#/definitions/dto.NodeDataResponse'
      duration:
        type: number
      endAt:
        type: string
      id:
        type: string
      logs:
        items:
          type: string
        type: array
      metadata:
        additionalProperties: true
        type: object
      name:
        type: string
      nodes:
        items:
          $ref: '#/definitions/dto.TraceNodeResponse'
        type: array
      referenceId:
        type: string
      startAt:
        type: string
      status:
        type: string
      type:
        type: string
      updatedAt:
        type: string
      updatedBy:
        type: string
    type: object
  dto.TraceResponse:
    properties:
      chatAgentId:
        type: string
      contextType:
        type: string
      conversationId:
        type: string
      createdAt:
        type: string
      createdBy:
        type: string
      id:
        type: string
      logs:
        items:
          type: string
        type: array
      nodes:
        items:
          $ref: '#/definitions/dto.TraceNodeResponse'
        type: array
      referenceId:
        type: string
      referenceMetadata:
        additionalProperties: true
        type: object
      referenceName:
        type: string
      tenantId:
        type: string
      updatedAt:
        type: string
      updatedBy:
        type: string
      workflowId:
        type: string
    type: object
  dto.WorkflowImportTraceRequest:
    properties:
      executionId:
        description: |-
          ExecutionID is the external execution/run identifier (e.g., N8N execution ID).
          Required for initial import.
        type: string
      sessionId:
        description: SessionID is an optional session identifier for finding executions.
        type: string
      type:
        description: |-
          Type is the agent type for the import (e.g., "N8N", "MICROSOFT_FOUNDRY").
          This determines which importer to use.
        type: string
    required:
    - executionId
    - type
    type: object
  dto.WorkflowRunResponse:
    properties:
      id:
        type: string
      mode:
        type: string
      startedAt:
        type: string
      status:
        type: string
      stoppedAt:
        type: string
    type: object
  handlers.BulkReactionsResponse:
    properties:
      reactions:
        additionalProperties:
          items:
            $ref: '#/definitions/handlers.ReactionResponse'
          type: array
        type: object
    type: object
  handlers.EditMessageRequest:
    properties:
      content:
        maxLength: 32000
        minLength: 1
        type: string
    required:
    - content
    type: object
  handlers.FileAttachment:
    properties:
      detail:
        type: string
      fileData:
        type: string
      fileId:
        type: string
      filename:
        type: string
      imageUrl:
        type: string
      mimeType:
        type: string
      type:
        enum:
        - image
        - file
        - audio
        type: string
    required:
    - type
    type: object
  handlers.GetMessagesResponse:
    properties:
      hasMore:
        type: boolean
      messages:
        items:
          $ref: '#/definitions/handlers.MessageResponse'
        type: array
    type: object
  handlers.HealthResponse:
    properties:
      components:
        additionalProperties:
          type: string
        type: object
      debug_backdoor_enabled:
        type: boolean
      status:
        type: string
    type: object
  handlers.InvokeConfig:
    properties:
      chatHistoryMessageCount:
        type: integer
      contextData:
        additionalProperties:
          type: string
        type: object
    type: object
  handlers.ListReactionsResponse:
    properties:
      reactions:
        items:
          $ref: '#/definitions/handlers.ReactionResponse'
        type: array
    type: object
  handlers.MessageContent:
    properties:
      attachments:
        items:
          type: string
        type: array
      content:
        maxLength: 32000
        minLength: 1
        type: string
      files:
        items:
          $ref: '#/definitions/handlers.FileAttachment'
        type: array
    required:
    - content
    type: object
  handlers.MessageResponse:
    properties:
      attachmentsMetadata:
        items:
          $ref: '#/definitions/models.AttachmentMetadata'
        type: array
      chatAgentId:
        type: string
      content:
        type: string
      conversationId:
        type: string
      createdAt:
        type: string
      errorMessage:
        type: string
      extra:
        additionalProperties: true
        type: object
      id:
        type: string
      metadata:
        $ref: '#/definitions/models.AssistantMetadata'
      status:
        $ref: '#/definitions/models.MessageStatus'
      statusTraces:
        items:
          $ref: '#/definitions/models.StatusTrace'
        type: array
      type:
        $ref: '#/definitions/models.MessageType'
      updatedAt:
        type: string
      userId:
        type: string
      userMessageId:
        type: string
    type: object
  handlers.MessageWithContextResponse:
    properties:
      message:
        $ref: '#/definitions/handlers.MessageResponse'
      userMessage:
        $ref: '#/definitions/handlers.MessageResponse'
    type: object
  handlers.ReactionResponse:
    properties:
      conversationId:
        type: string
      createdAt:
        type: string
      feedbackText:
        type: string
      id:
        type: string
      messageId:
        type: string
      reaction:
        $ref: '#/definitions/models.ReactionType'
      tenantId:
        type: string
      updatedAt:
        type: string
      userId:
        type: string
    type: object
  handlers.SearchMessagesResponse:
    properties:
      messages:
        items:
          $ref: '#/definitions/handlers.MessageResponse'
        type: array
    type: object
  handlers.SendMessageRequest:
    properties:
      chatAgentId:
        type: string
      conversationId:
        type: string
      extConversationId:
        type: string
      extra:
        additionalProperties: true
        type: object
      invokeConfig:
        $ref: '#/definitions/handlers.InvokeConfig'
      message:
        $ref: '#/definitions/handlers.MessageContent'
    required:
    - chatAgentId
    - message
    type: object
  handlers.SendMessageResponse:
    properties:
      assistantMessageId:
        type: string
      conversationId:
        type: string
      userMessageId:
        type: string
    type: object
  handlers.UpsertReactionRequest:
    properties:
      feedbackText:
        type: string
      reaction:
        $ref: '#/definitions/models.ReactionType'
      reasons:
        items:
          type: string
        type: array
    required:
    - reaction
    type: object
  models.AssistantMetadata:
    properties:
      agentType:
        type: string
      executionId:
        type: string
      extMessageId:
        description: |-
          ExtMessageID is the external message ID from the backend (e.g., Foundry message ID).
          This allows mapping between chat messages and trace nodes.
        type: string
      latencyMs:
        type: integer
      model:
        type: string
      tokensInput:
        type: integer
      tokensOutput:
        type: integer
    type: object
  models.AttachmentMetadata:
    properties:
      fileCategory:
        type: string
      fileId:
        type: string
      fileName:
        type: string
      fileSize:
        type: integer
      fileType:
        type: string
    type: object
  models.MessageStatus:
    enum:
    - pending
    - success
    - failed
    - cancelled
    type: string
    x-enum-comments:
      MessageStatusCanceled: nolint:misspell // value must stay "cancelled" for external
        API compatibility
    x-enum-descriptions:
    - ""
    - ""
    - ""
    - nolint:misspell // value must stay "cancelled" for external API compatibility
    x-enum-varnames:
    - MessageStatusPending
    - MessageStatusSuccess
    - MessageStatusFailed
    - MessageStatusCanceled
  models.MessageType:
    enum:
    - user
    - assistant
    - reasoning
    - tool_call
    - tool_result
    - plan
    - sub_agent
    type: string
    x-enum-varnames:
    - MessageTypeUser
    - MessageTypeAssistant
    - MessageTypeReasoning
    - MessageTypeToolCall
    - MessageTypeToolResult
    - MessageTypePlan
    - MessageTypeSubAgent
  models.ReactionType:
    enum:
    - thumbs_up
    - thumbs_down
    type: string
    x-enum-varnames:
    - ReactionThumbsUp
    - ReactionThumbsDown
  models.StatusTrace:
    properties:
      content:
        type: string
      data:
        additionalProperties: true
        type: object
      name:
        type: string
      timestamp:
        type: string
      type:
        type: string
    type: object
host: localhost:8085
info:
  contact:
    email: support@unifiedui.io
    name: API Support
    url: https://github.com/unifiedui/agent-service
  description: Unified abstraction layer for heterogeneous AI agent backends (N8N,
    Microsoft Foundry, Copilot, LangChain)
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: http://swagger.io/terms/
  title: UnifiedUI Chat Service API
  version: "1.0"
paths:
  /api/v1/agent-service/health:
    get:
      description: Returns the overall health status and component statuses
      produces:
      - application/json
      responses:
        "200":
          description: Service healthy
          schema:
            $ref: '#/definitions/handlers.HealthResponse'
        "503":
          description: Service unhealthy
          schema:
            $ref: '#/definitions/handlers.HealthResponse'
      summary: Health check
      tags:
      - Health
  /api/v1/agent-service/live:
    get:
      description: Returns 200 if the service is alive
      produces:
      - application/json
      responses:
        "200":
          description: Service alive
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Liveness check
      tags:
      - Health
  /api/v1/agent-service/ready:
    get:
      description: Returns 200 if the service is ready to accept traffic
      produces:
      - application/json
      responses:
        "200":
          description: Service ready
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service not ready
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Readiness check
      tags:
      - Health
  /api/v1/agent-service/tenants/{tenantId}/ai/analyze-trace:
    post:
      consumes:
      - application/json
      description: Analyzes a failed trace node and provides root cause analysis and
        suggested fixes
      parameters:
      - description: Tenant ID
        in: path
        name: tenantId
        required: true
        type: string
      - description: Trace analysis request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.AnalyzeTraceRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.AnalyzeTraceResponse'
        "400":
          description: Bad request - validation error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Analyze a trace error using AI
      tags:
      - AI
  /api/v1/agent-service/tenants/{tenantId}/ai/capabilities:
    get:
      description: Returns which AI features are available based on configured models
      parameters:
      - description: Tenant ID
        in: path
        name: tenantId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.AICapabilitiesResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get available AI capabilities for a tenant
      tags:
      - AI
  /api/v1/agent-service/tenants/{tenantId}/ai/generate-description:
    post:
      consumes:
      - application/json
      description: Uses configured LLM models to generate or polish a description
        for any entity type
      parameters:
      - description: Tenant ID
        in: path
        name: tenantId
        required: true
        type: string
      - description: Description generation request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.GenerateDescriptionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.GenerateDescriptionResponse'
        "400":
          description: Bad request - validation error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Generate or improve an entity description using AI
      tags:
      - AI
  /api/v1/agent-service/tenants/{tenantId}/ai/summarize-trace:
    post:
      consumes:
      - application/json
      description: Summarizes trace nodes at the specified detail level (short, medium,
        long)
      parameters:
      - description: Tenant ID
        in: path
        name: tenantId
        required: true
        type: string
      - description: Trace summarization request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.SummarizeTraceRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.SummarizeTraceResponse'
        "400":
          description: Bad request - validation error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Summarize a trace using AI
      tags:
      - AI
  /api/v1/agent-service/tenants/{tenantId}/ai/test-model:
    post:
      consumes:
      - application/json
      description: Tests LLM connectivity by sending a simple ping message with the
        provided config and credentials
      parameters:
      - description: Tenant ID
        in: path
        name: tenantId
        required: true
        type: string
      - description: Model test request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.TestModelRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.TestModelResponse'
        "400":
          description: Bad request - validation error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Test an AI model configuration
      tags:
      - AI
  /api/v1/agent-service/tenants/{tenantId}/ai/trace-chat:
    post:
      consumes:
      - application/json
      description: Handles conversational questions about a trace, maintaining chat
        history for context
      parameters:
      - description: Tenant ID
        in: path
        name: tenantId
        required: true
        type: string
      - description: Trace chat request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.TraceChatRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.TraceChatResponse'
        "400":
          description: Bad request - validation error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Chat about a trace using AI
      tags:
      - AI
  /api/v1/agent-service/tenants/{tenantId}/connections/test:
    post:
      consumes:
      - application/json
      description: Tests connectivity to an external service (n8n, Foundry, REST API)
        with the provided URL, credentials and configuration
      parameters:
      - description: Tenant ID
        in: path
        name: tenantId
        required: true
        type: string
      - description: Connection test request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.TestConnectionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.TestConnectionResponse'
        "400":
